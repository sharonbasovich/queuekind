name: Verify review filters
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm test && npm run build
      - run: npm ci --ignore-scripts --prefix capture && ./capture/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          node capture/serve.mjs &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node capture/filters.mjs
          QUEUEKIND_VERIFY_CURRENT=1 node capture/record.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-filters-${{ github.sha }}
          path: |
            filter-output/
            capture-output/
          retention-days: 3
